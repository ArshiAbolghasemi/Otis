services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - otis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-otis} -d ${POSTGRES_DB:-otis}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  otis_pgdata:
