services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - otis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  otis:
    build:
      context: .
    image: otis:latest
    command: ["bash", "entrypoints/api.sh"]
    env_file:
      - .env
    environment:
      # Reach the other services over the compose network.
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
    image: otis:latest
    command: ["bash", "entrypoints/worker.sh"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    # The worker runs the AI Farm script, so it needs AIFARM_ROOT (and the
    # runtime the product entrypoints expect) inside the container:
    # volumes:
    #   - ${AIFARM_ROOT}:${AIFARM_ROOT}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  otis_pgdata:
